name: Validar y publicar KubeExplora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubeexplora-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validar contenido y construir
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar herramientas de validación
        run: npm ci --ignore-scripts
      - name: Comprobar JavaScript
        run: npm run check
      - name: Validar catálogo, YAML y simulaciones
        run: npm test
      - name: Construir sitio estático
        run: npm run build
      - name: Guardar artefacto
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
  deploy:
    name: Publicar en GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preparar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
